services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinesync-ai-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
      - ./models-cache:/app/models-cache
    restart: unless-stopped
